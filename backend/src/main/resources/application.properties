server.port=8080
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# No default: the app must not start with a guessable signing key (see JwtUtil)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# First admin account, created at startup if it doesn't exist yet (see DataInitializer)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Password reset emails. The SMTP server is set with SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD; without SPRING_MAIL_HOST the reset link is only logged.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@finai.local}
# Address of the frontend, used to build the link in the reset email
app.base-url=${APP_BASE_URL:http://localhost:3000}
