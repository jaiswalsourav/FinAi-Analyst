services:
  frontend:
    image: jaiswalsourav/finaianalyst-frontend:v1
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai-service

  backend:
    image: jaiswalsourav/finaianalyst-backend:v1
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - ai-service

  ai-service:
    image: jaiswalsourav/finaianalyst-ai-service:v1
    build: ./ai-service
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
