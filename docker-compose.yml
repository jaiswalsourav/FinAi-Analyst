services:
  frontend:
    image: finaianalyst-frontend:latest
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai-service

  backend:
    image: finaianalyst-backend:latest
    build: ./backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8080:8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      - ai-service

  ai-service:
    image: finaianalyst-ai-service:latest
    build: ./ai-service
    ports:
      - "8001:8001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}